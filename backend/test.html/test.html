<!DOCTYPE html>
<html>
<head>
  <title>BetterNotes Test</title>
  <style>
    body { font-family: Arial; max-width: 600px; margin: 50px auto; padding: 20px; }
    input { width: 100%; padding: 10px; font-size: 16px; margin-bottom: 10px; }
    button { padding: 10px 20px; background: #007bff; color: white; border: none; cursor: pointer; font-size: 16px; }
    #answer { margin-top: 20px; padding: 15px; background: #f0f0f0; border-radius: 8px; min-height: 50px; line-height: 1.6; }
    #status { color: gray; font-size: 14px; margin-top: 5px; }
  </style>
</head>
<body>
  <h2>🧠 BetterNotes AI</h2>
  <input type="text" id="question" placeholder="Ask something from your notes..." />
  <button onclick="askQuestion()">Ask</button>
  <div id="status"></div>
  <div id="answer"></div>

  <script>
    async function askQuestion() {
      const question = document.getElementById('question').value;
      const answerDiv = document.getElementById('answer');
      const statusDiv = document.getElementById('status');
      
      answerDiv.innerText = '';
      statusDiv.innerText = '⏳ Thinking...';
      
      const startTime = Date.now();

      const response = await fetch('http://localhost:5000/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question })
      });

      const reader = response.body.getReader();
      const decoder = new TextDecoder();

      let firstTokenTime = null;

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        const text = decoder.decode(value);
        const lines = text.split('\n').filter(l => l.startsWith('data:'));

        for (const line of lines) {
          const data = JSON.parse(line.replace('data: ', ''));

          if (data.type === 'token') {
            if (!firstTokenTime) {
              firstTokenTime = Date.now();
              statusDiv.innerText = `⚡ First word in ${((firstTokenTime - startTime)/1000).toFixed(1)}s`;
            }
            answerDiv.innerText += data.token;
          }

          if (data.type === 'done') {
            const totalTime = ((Date.now() - startTime)/1000).toFixed(1);
            statusDiv.innerText += ` | ✅ Total: ${totalTime}s`;
          }
        }
      }
    }

    // Allow pressing Enter to ask
    document.getElementById('question').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') askQuestion();
    });
  </script>
</body>
</html>
